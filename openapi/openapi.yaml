openapi: 3.1.0
info:
  title: VulnOps Hub
  description: "Vulnerability-operations control plane \u2014 modular monolith"
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Liveness probe
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/organizations/{org_id}/sboms:
    post:
      tags:
      - sboms
      summary: Submit Sbom
      operationId: submit_sbom_api_v1_organizations__org_id__sboms_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: Content-Type
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Content-Type
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/sboms/{sbom_id}:
    get:
      tags:
      - sboms
      summary: Get Sbom
      operationId: get_sbom_api_v1_organizations__org_id__sboms__sbom_id__get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: sbom_id
        in: path
        required: true
        schema:
          type: string
          title: Sbom Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases:
    post:
      tags:
      - cases
      summary: Create Case
      operationId: create_case_api_v1_organizations__org_id__cases_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - cases
      summary: List Cases
      operationId: list_cases_api_v1_organizations__org_id__cases_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
      - name: owner_team
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Team
      - name: assignee
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
      - name: sla_breached
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sla Breached
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?(created_at|updated_at|due_at|priority)$
          default: -created_at
          title: Sort
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases/{case_id}:
    get:
      tags:
      - cases
      summary: Get Case
      operationId: get_case_api_v1_organizations__org_id__cases__case_id__get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases/{case_id}/allowed-transitions:
    get:
      tags:
      - cases
      summary: Allowed Transitions
      operationId: allowed_transitions_api_v1_organizations__org_id__cases__case_id__allowed_transitions_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases/{case_id}/transitions:
    post:
      tags:
      - cases
      summary: Transition Case
      operationId: transition_case_api_v1_organizations__org_id__cases__case_id__transitions_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases/{case_id}/risk-decisions:
    post:
      tags:
      - cases
      summary: Create Risk Decision
      operationId: create_risk_decision_api_v1_organizations__org_id__cases__case_id__risk_decisions_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - cases
      summary: List Risk Decisions
      operationId: list_risk_decisions_api_v1_organizations__org_id__cases__case_id__risk_decisions_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskDecisionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/organizations/{org_id}/cases/{case_id}/verifications:
    get:
      tags:
      - cases
      summary: List Verifications
      operationId: list_verifications_api_v1_organizations__org_id__cases__case_id__verifications_get
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - cases
      summary: Submit Verification
      operationId: submit_verification_api_v1_organizations__org_id__cases__case_id__verifications_post
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    CaseDetailResponse:
      properties:
        id:
          type: string
          title: Id
        case_key:
          type: string
          title: Case Key
        title:
          type: string
          title: Title
        status:
          type: string
          title: Status
        priority:
          type: string
          title: Priority
        owner_team:
          type: string
          title: Owner Team
        assignee:
          anyOf:
          - type: string
          - type: 'null'
          title: Assignee
        organization_id:
          type: string
          title: Organization Id
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
        version:
          type: integer
          title: Version
        etag:
          type: string
          title: Etag
        due_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Due At
        exposures:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Exposures
        sla_breached:
          type: boolean
          title: Sla Breached
        closure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Closure Reason
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - case_key
      - title
      - status
      - priority
      - owner_team
      - organization_id
      - version
      - etag
      - sla_breached
      title: CaseDetailResponse
    CaseListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CaseDetailResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: CaseListResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RiskDecisionResponse:
      properties:
        id:
          type: string
          title: Id
        case_id:
          type: string
          title: Case Id
        type:
          type: string
          title: Type
        status:
          type: string
          title: Status
        scope_exposure_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scope Exposure Ids
        reason:
          type: string
          title: Reason
        compensating_controls:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Compensating Controls
        evidence_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Evidence Ids
        requested_by:
          type: string
          title: Requested By
        approver:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver
        approver_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Approver Role
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - case_id
      - type
      - status
      - reason
      - requested_by
      title: RiskDecisionResponse
    RiskDecisionsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RiskDecisionResponse'
          type: array
          title: Items
      type: object
      required:
      - items
      title: RiskDecisionsResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerificationResponse:
      properties:
        id:
          type: string
          title: Id
        case_id:
          type: string
          title: Case Id
        method:
          type: string
          title: Method
        asserted_result:
          anyOf:
          - type: string
          - type: 'null'
          title: Asserted Result
        evidence_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Evidence Ids
        coverage:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Coverage
        status:
          type: string
          title: Status
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - id
      - case_id
      - method
      - status
      title: VerificationResponse
    VerificationsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/VerificationResponse'
          type: array
          title: Items
      type: object
      required:
      - items
      title: VerificationsResponse
