services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulnops
      POSTGRES_PASSWORD: vulnops
      POSTGRES_DB: vulnops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnops"]
      interval: 5s
      timeout: 2s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # Optional: enable bucket versioning before a live backup drill
  #   docker compose --profile object-storage-versioning up -d
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [object-storage-versioning]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/vulnops-snapshots &&
      mc version enable local/vulnops-snapshots
      "
    restart: "no"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 2s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://vulnops:vulnops@postgres:5432/vulnops
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c /app/alembic.ini upgrade head
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://vulnops:vulnops@postgres:5432/vulnops
      REDIS_URL: redis://valkey:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: vulnops-snapshots
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      AUTH_TEST_BYPASS_ENABLED: ${AUTH_TEST_BYPASS_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn vulnops.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 2s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://vulnops:vulnops@postgres:5432/vulnops
      REDIS_URL: redis://valkey:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: vulnops-snapshots
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m vulnops.workers.ingestion
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://vulnops:vulnops@postgres:5432/vulnops
      REDIS_URL: redis://valkey:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: vulnops-snapshots
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      CASE_AUTO_CREATE_ENABLED: ${CASE_AUTO_CREATE_ENABLED:-true}
      DEFAULT_CASE_OWNER_TEAM: ${DEFAULT_CASE_OWNER_TEAM:-unassigned}
      ORCHESTRATOR_POLL_INTERVAL_SECONDS: ${ORCHESTRATOR_POLL_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m vulnops.workers.orchestration
    restart: unless-stopped

  poller:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://vulnops:vulnops@postgres:5432/vulnops
      REDIS_URL: redis://valkey:6379/0
      DEFECTDOJO_BASE_URL: ${DEFECTDOJO_BASE_URL:-}
      DEFECTDOJO_API_TOKEN: ${DEFECTDOJO_API_TOKEN:-}
      DEFECTDOJO_POLL_INTERVAL_SECONDS: ${DEFECTDOJO_POLL_INTERVAL_SECONDS:-300}
      WAZUH_BASE_URL: ${WAZUH_BASE_URL:-}
      WAZUH_API_USER: ${WAZUH_API_USER:-wazuh}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
      WAZUH_POLL_INTERVAL_SECONDS: ${WAZUH_POLL_INTERVAL_SECONDS:-300}
      POLL_ORGANIZATION_ID: ${POLL_ORGANIZATION_ID:-org-demo}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python -m vulnops.workers.polling
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
