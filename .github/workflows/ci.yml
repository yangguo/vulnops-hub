name: CI

on:
  push:
    branches: [main, feat/*, fix/*, codex/*]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check (optional)
        run: uv run mypy src || true
      - name: Unit tests
        run: uv run pytest -q --ignore=tests/integration --ignore=tests/e2e
      - name: Integration and contract tests
        run: uv run pytest tests/integration tests/contract -q
      - name: E2E fixture test
        run: uv run pytest tests/e2e -q
      - name: Validate OpenAPI
        env:
          ENVIRONMENT: test
          AUTH_TEST_BYPASS_ENABLED: "true"
        run: |
          uv run python -c "from vulnops.main import create_app; app=create_app(); print(app.openapi()['openapi'])"
          test -f openapi/openapi.yaml
          echo "OpenAPI valid"
      - name: Alembic upgrade and check
        run: |
          rm -f vulnops.db
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t vulnops-hub:test .
      - name: Smoke health
        run: |
          docker run -d --name hub -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./vulnops.db \
            -e ENVIRONMENT=test \
            -e AUTH_TEST_BYPASS_ENABLED=false \
            -e OIDC_ISSUER_URL=https://issuer.invalid \
            -e OIDC_AUDIENCE=vulnops-api \
            vulnops-hub:test
          sleep 5
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/ | grep -q 'id="app"'
          docker rm -f hub

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      - name: Type check
        run: pnpm typecheck
        working-directory: frontend
      - name: Unit tests
        run: pnpm test
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-type-test, frontend]
    env:
      E2E_API_URL: http://127.0.0.1:8010
      E2E_OIDC_ISSUER: http://127.0.0.1:9000
      E2E_OIDC_AUDIENCE: vulnops-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --extra dev
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build frontend with CI OIDC settings
        run: pnpm build
        working-directory: frontend
        env:
          VITE_OIDC_AUTHORITY: http://127.0.0.1:9000
          VITE_OIDC_CLIENT_ID: vulnops-e2e
          VITE_OIDC_REDIRECT_URI: http://127.0.0.1:4173/auth/callback
          VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:4173/login
          VITE_OIDC_SCOPE: openid profile email
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E smoke
        run: pnpm exec playwright test
        working-directory: frontend
