name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check (optional)
        run: uv run mypy src || true
      - name: Unit tests
        run: uv run pytest -q --ignore=tests/integration --ignore=tests/e2e
      - name: Integration and contract tests
        run: uv run pytest tests/integration tests/contract -q
      - name: E2E fixture test
        run: uv run pytest tests/e2e -q
      - name: Validate OpenAPI
        run: |
          uv run python -c "from vulnops.main import create_app; app=create_app(); print(app.openapi()['openapi'])"
          test -f openapi/openapi.yaml
          echo "OpenAPI valid"
      - name: Alembic upgrade and check
        run: |
          rm -f vulnops.db
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vulnops-hub:test .
      - name: Smoke health
        run: |
          docker run -d --name hub -p 8000:8000 -e DATABASE_URL=sqlite:///./vulnops.db vulnops-hub:test
          sleep 5
          curl -f http://localhost:8000/health/live
          curl -f http://localhost:8000/health/ready
          docker rm -f hub

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint
        run: pnpm lint
        working-directory: frontend
      - name: Type check
        run: pnpm typecheck
        working-directory: frontend
      - name: Unit tests
        run: pnpm test
        working-directory: frontend
      - name: Build
        run: pnpm build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-type-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv && uv sync --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E smoke
        run: pnpm exec playwright test
        working-directory: frontend
