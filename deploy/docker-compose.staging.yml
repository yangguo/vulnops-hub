# Staging sandbox orchestration for VulnOps Hub integrated testing.
#
# Each sandbox runs behind an independent profile so only the stacks needed
# for the current evidence collection are up:
#
#   docker compose -f deploy/docker-compose.staging.yml --profile defectdojo up -d
#   docker compose -f deploy/docker-compose.staging.yml --profile wazuh up -d
#   docker compose -f deploy/docker-compose.staging.yml --profile keycloak up -d
#
# Sandboxes publish host ports only; the VulnOps api/worker containers reach
# them via http://host.docker.internal:<port>, so the application compose
# file stays untouched. Vulnerability-Lookup is deliberately NOT defined here:
# it builds from source with its own backing services and is launched from
# its own repository — see docs/operations/integrated-staging.md.
#
# Credentials below are sandbox-only defaults from .env.staging.example.
# Never expose any of these stacks beyond the loopback interface.

services:
  # --- DefectDojo (profile: defectdojo) ------------------------------------
  dojo-postgres:
    image: postgres:16-alpine
    profiles: [defectdojo]
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DOJO_PG_PASSWORD:-defectdojo}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - dojo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo"]
      interval: 5s
      timeout: 2s
      retries: 12

  dojo-valkey:
    image: valkey/valkey:8-alpine
    profiles: [defectdojo]
    volumes:
      - dojo_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12

  dojo-uwsgi:
    image: defectdojo/defectdojo-django:latest
    profiles: [defectdojo]
    entrypoint: /entrypoint-uwsgi.sh
    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: ${DOJO_SECRET_KEY:-staging-secret-key-change-me}
      DD_CREDENTIAL_AES_256_KEY: ${DOJO_CREDENTIAL_KEY:-staging-credential-key-change-me}
      DD_DATABASE_URL: postgresql://defectdojo:${DOJO_PG_PASSWORD:-defectdojo}@dojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
      DD_CACHE_URL: redis://dojo-valkey:6379/1
      DD_UWSGI_HOST: dojo-uwsgi
      DD_UWSGI_PORT: "3031"
    depends_on:
      dojo-postgres:
        condition: service_healthy
      dojo-valkey:
        condition: service_healthy
      dojo-initializer:
        condition: service_completed_successfully

  dojo-nginx:
    image: defectdojo/defectdojo-nginx:latest
    profiles: [defectdojo]
    ports:
      - "${DOJO_HTTP_PORT:-8081}:8080"
    environment:
      DD_UWSGI_HOST: dojo-uwsgi
      DD_UWSGI_PORT: "3031"
    depends_on:
      - dojo-uwsgi

  dojo-celeryworker:
    image: defectdojo/defectdojo-django:latest
    profiles: [defectdojo]
    entrypoint: /entrypoint-celery-worker.sh
    command: --loglevel=INFO
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:${DOJO_PG_PASSWORD:-defectdojo}@dojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
      DD_CACHE_URL: redis://dojo-valkey:6379/1
      DD_SECRET_KEY: ${DOJO_SECRET_KEY:-staging-secret-key-change-me}
      DD_CREDENTIAL_AES_256_KEY: ${DOJO_CREDENTIAL_KEY:-staging-credential-key-change-me}
    depends_on:
      dojo-postgres:
        condition: service_healthy
      dojo-valkey:
        condition: service_healthy
      dojo-initializer:
        condition: service_completed_successfully

  dojo-celerybeat:
    image: defectdojo/defectdojo-django:latest
    profiles: [defectdojo]
    entrypoint: /entrypoint-celery-beat.sh
    command: --loglevel=INFO
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:${DOJO_PG_PASSWORD:-defectdojo}@dojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
      DD_CACHE_URL: redis://dojo-valkey:6379/1
      DD_SECRET_KEY: ${DOJO_SECRET_KEY:-staging-secret-key-change-me}
      DD_CREDENTIAL_AES_256_KEY: ${DOJO_CREDENTIAL_KEY:-staging-credential-key-change-me}
    depends_on:
      dojo-postgres:
        condition: service_healthy
      dojo-valkey:
        condition: service_healthy
      dojo-initializer:
        condition: service_completed_successfully

  dojo-initializer:
    image: defectdojo/defectdojo-django:latest
    profiles: [defectdojo]
    entrypoint: /entrypoint-initializer.sh
    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_SECRET_KEY: ${DOJO_SECRET_KEY:-staging-secret-key-change-me}
      DD_CREDENTIAL_AES_256_KEY: ${DOJO_CREDENTIAL_KEY:-staging-credential-key-change-me}
      DD_DATABASE_URL: postgresql://defectdojo:${DOJO_PG_PASSWORD:-defectdojo}@dojo-postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://dojo-valkey:6379/0
      DD_CACHE_URL: redis://dojo-valkey:6379/1
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: ${DOJO_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: ${DOJO_ADMIN_PASSWORD:-sandbox-admin-password}
      DD_ADMIN_MAIL: admin@sandbox.local
    depends_on:
      dojo-postgres:
        condition: service_healthy

  # --- Wazuh manager (profile: wazuh) --------------------------------------
  # Manager only: the Wazuh API (55000) exposes agent inventory and syscollector
  # package lists, which is the evidence the acceptance matrix requires. The
  # indexer is an optional follow-up (certificates + vm.max_map_count).
  wazuh-manager:
    image: wazuh/wazuh-manager:4.12.0
    profiles: [wazuh]
    ports:
      - "${WAZUH_API_PORT:-55000}:55000"
    environment:
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: secret
      INDEXER_SSL_CA: ""
      INDEXER_SSL_CERTIFICATE: ""
      INDEXER_SSL_KEY: ""
    volumes:
      - wazuh_manager_data:/var/ossec/data

  # --- Keycloak (profile: keycloak) ----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: [keycloak]
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8082}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-sandbox-admin-password}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/vulnops-realm.json:/opt/keycloak/data/import/vulnops-realm.json:ro

networks:
  default: {}

volumes:
  dojo_postgres_data:
  dojo_valkey_data:
  wazuh_manager_data:
